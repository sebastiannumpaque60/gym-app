<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // 🔥 TU CONFIGURACIÓN REAL (YA PUESTA)
  const firebaseConfig = {
    apiKey: "AIzaSyAx8PXAhu-Zsd8Iez7EyShVFyq92jlXLOo",
    authDomain: "gym-app-4137a.firebaseapp.com",
    projectId: "gym-app-4137a",
    storageBucket: "gym-app-4137a.firebasestorage.app",
    messagingSenderId: "58172819530",
    appId: "1:58172819530:web:f4497299ce9de909e2beb3"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const resumen = document.getElementById("resumen");
  let usuarioActual = null;

  // Login automático
  signInAnonymously(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      usuarioActual = user;
      mostrarProgreso();
    }
  });

  // Guardar entrenamiento
  window.guardarEntrenamiento = async function () {
    if (!usuarioActual) {
      alert("Usuario no autenticado");
      return;
    }

    await addDoc(collection(db, "entrenamientos"), {
      uid: usuarioActual.uid,
      fecha: serverTimestamp()
    });

    mostrarProgreso();
    alert("💪 Entrenamiento guardado");
  };

  // Mostrar progreso
  async function mostrarProgreso() {
    if (!usuarioActual) return;

    const q = query(
      collection(db, "entrenamientos"),
      where("uid", "==", usuarioActual.uid)
    );

    const snap = await getDocs(q);
    resumen.innerText = `Has entrenado ${snap.size} veces 🔥`;
  }
</script>
